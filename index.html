<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HOOPMATE — Game on.</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./css/output.css" />
  </head>
  <body class="min-h-screen bg-court-bg font-sans text-court-cream antialiased">
  <!-- Container utama -->
  <div class="mx-auto max-w-7xl px-4 py-5 sm:px-6 lg:px-8">
    <!-- Header -->
    <header class="mb-5 flex flex-wrap items-center justify-between gap-3">
      <!-- Logo & nama app -->
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-court-orange font-display text-lg font-bold text-court-bg">
          H+
        </div>
        <div>
          <h1 class="font-display text-xl font-bold tracking-tight text-court-cream">
            HOOPMATE
          </h1>
          <p class="text-xs text-court-muted">Pickup 3v3 Utility</p>
        </div>
      </div>
      <!-- Tombol aksi header -->
      <div class="flex items-center gap-2">
        <button
          id="btn-new-session"
          type="button"
          class="rounded-xl bg-court-orange px-3.5 py-2 text-xs font-bold text-court-bg transition hover:opacity-90 sm:text-sm"
        >
          Sesi Baru +
        </button>
      </div>
    </header>
    <!-- Konten utama -->
    <main class="space-y-5">
      <!-- Card 1: Info Sesi -->
      <section
        aria-label="Info Sesi"
        class="rounded-2xl border border-court-border bg-court-card p-5"
      >
        <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
          <!-- Tanggal & nama sesi -->
          <div>
            <p id="session-date" class="text-xs font-medium uppercase tracking-wider text-court-muted">
              Minggu, 15 Nov 2026
            </p>
            <h2 id="session-title" class="mt-1 font-display text-2xl font-bold text-court-cream">
              Sunday 3x3 Run
            </h2>
          </div>
          <!-- Ringkasan statistik sesi -->
          <div class="grid grid-cols-3 gap-3">
            <div class="rounded-xl border border-court-border bg-court-box px-4 py-2.5 text-center">
              <span class="block text-[11px] uppercase tracking-wider text-court-muted">Pemain</span>
              <span id="stat-players" class="font-display text-xl font-bold text-court-cream">0</span>
            </div>
            <div class="rounded-xl border border-court-border bg-court-box px-4 py-2.5 text-center">
              <span class="block text-[11px] uppercase tracking-wider text-court-muted">Tim 3v3</span>
              <span id="stat-teams" class="font-display text-xl font-bold text-court-orange">0</span>
            </div>
            <div class="rounded-xl border border-court-border bg-court-box px-4 py-2.5 text-center">
              <span class="block text-[11px] uppercase tracking-wider text-court-muted">Selesai</span>
              <span id="stat-completed" class="font-display text-xl font-bold text-court-lime">0</span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
