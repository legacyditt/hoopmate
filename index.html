<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HOOPMATE — Game on.</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./css/output.css" />
  </head>
  <body class="min-h-screen bg-court-bg font-sans text-court-cream antialiased">
    <!-- Container utama -->
    <div class="mx-auto max-w-7xl px-4 py-5 sm:px-6 lg:px-8">
      <!-- Header -->
      <header class="mb-5 flex flex-wrap items-center justify-between gap-3">
        <!-- Logo & nama app -->
        <div class="flex items-center gap-3">
          <div
            class="flex h-10 w-10 items-center justify-center rounded-xl bg-court-orange font-display text-lg font-bold text-court-bg"
          >
            H+
          </div>
          <div>
            <h1
              class="font-display text-xl font-bold tracking-tight text-court-cream"
            >
              HOOPMATE
            </h1>
            <p class="text-xs text-court-muted">Pickup 3v3 Utility</p>
          </div>
        </div>
        <!-- Tombol aksi header -->
        <div class="flex items-center gap-2">
          <button
            id="btn-new-session"
            type="button"
            class="rounded-xl bg-court-orange px-3.5 py-2 text-xs font-bold text-court-bg transition hover:opacity-90 sm:text-sm"
          >
            Sesi Baru +
          </button>
        </div>
      </header>
      <!-- Konten utama -->
      <main class="space-y-5">
        <!-- Card 1: Info Sesi -->
        <section
          aria-label="Info Sesi"
          class="rounded-2xl border border-court-border bg-court-card p-5"
        >
          <div
            class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center"
          >
            <!-- Tanggal & nama sesi -->
            <div>
              <p
                id="session-date"
                class="text-xs font-medium uppercase tracking-wider text-court-muted"
              >
                Minggu, 15 Nov 2026
              </p>
              <h2
                id="session-title"
                class="mt-1 font-display text-2xl font-bold text-court-cream"
              >
                Sunday 3x3 Run
              </h2>
            </div>
            <!-- Ringkasan statistik sesi -->
            <div class="grid grid-cols-3 gap-3">
              <div
                class="rounded-xl border border-court-border bg-court-box px-4 py-2.5 text-center"
              >
                <span
                  class="block text-[11px] uppercase tracking-wider text-court-muted"
                  >Pemain</span
                >
                <span
                  id="stat-players"
                  class="font-display text-xl font-bold text-court-cream"
                  >0</span
                >
              </div>
              <div
                class="rounded-xl border border-court-border bg-court-box px-4 py-2.5 text-center"
              >
                <span
                  class="block text-[11px] uppercase tracking-wider text-court-muted"
                  >Tim 3v3</span
                >
                <span
                  id="stat-teams"
                  class="font-display text-xl font-bold text-court-orange"
                  >0</span
                >
              </div>
              <div
                class="rounded-xl border border-court-border bg-court-box px-4 py-2.5 text-center"
              >
                <span
                  class="block text-[11px] uppercase tracking-wider text-court-muted"
                  >Selesai</span
                >
                <span
                  id="stat-completed"
                  class="font-display text-xl font-bold text-court-lime"
                  >0</span
                >
              </div>
            </div>
          </div>
        </section>

        <!-- Grid 2 kolom di desktop -->
        <div class="grid grid-cols-1 gap-5 lg:grid-cols-12">
          <!-- Kolom kiri: Papan Skor & Daftar Pemain -->
          <div class="space-y-5 lg:col-span-5">
            <!-- Card 2: Papan Skor & Timer -->
            <section
              aria-label="Papan Skor dan Timer"
              class="rounded-2xl border border-court-border bg-court-card p-5"
            >
              <!-- Header card & tombol undo -->
              <div class="mb-4 flex items-center justify-between">
                <div>
                  <h3
                    class="font-display text-sm font-bold uppercase tracking-wider text-court-muted"
                  >
                    Papan Skor
                  </h3>
                  <p id="match-label" class="text-xs text-court-orange">
                    Match #1 • Siap Main
                  </p>
                </div>
                <button
                  id="btn-undo-score"
                  type="button"
                  class="rounded-lg border border-court-border bg-court-box px-3 py-1.5 text-xs font-medium text-court-muted transition hover:border-court-cream hover:text-court-cream"
                >
                  Undo
                </button>
              </div>

              <!-- Skor Tim A vs Tim B -->
              <div class="grid grid-cols-2 gap-3">
                <!-- Box Tim A -->
                <div
                  class="rounded-xl border border-court-border bg-court-box p-3 text-center"
                >
                  <p
                    id="team-a-name"
                    class="truncate text-xs font-bold uppercase tracking-wider text-court-muted"
                  >
                    Tim A
                  </p>
                  <p
                    id="team-a-score"
                    class="my-2 font-mono text-5xl font-bold tabular-nums text-court-cream"
                  >
                    0
                  </p>
                  <div class="grid grid-cols-2 gap-1.5">
                    <button
                      type="button"
                      data-team="A"
                      data-points="1"
                      class="rounded-lg border border-court-border bg-court-card py-1.5 font-mono text-xs font-bold text-court-cream transition hover:border-court-orange"
                    >
                      +1
                    </button>
                    <button
                      type="button"
                      data-team="A"
                      data-points="2"
                      class="rounded-lg border border-court-border bg-court-card py-1.5 font-mono text-xs font-bold text-court-cream transition hover:border-court-orange"
                    >
                      +2
                    </button>
                  </div>
                </div>

                <!-- Box Tim B -->
                <div
                  class="rounded-xl border border-court-border bg-court-box p-3 text-center"
                >
                  <p
                    id="team-b-name"
                    class="truncate text-xs font-bold uppercase tracking-wider text-court-muted"
                  >
                    Tim B
                  </p>
                  <p
                    id="team-b-score"
                    class="my-2 font-mono text-5xl font-bold tabular-nums text-court-cream"
                  >
                    0
                  </p>
                  <div class="grid grid-cols-2 gap-1.5">
                    <button
                      type="button"
                      data-team="B"
                      data-points="1"
                      class="rounded-lg border border-court-border bg-court-card py-1.5 font-mono text-xs font-bold text-court-cream transition hover:border-court-orange"
                    >
                      +1
                    </button>
                    <button
                      type="button"
                      data-team="B"
                      data-points="2"
                      class="rounded-lg border border-court-border bg-court-card py-1.5 font-mono text-xs font-bold text-court-cream transition hover:border-court-orange"
                    >
                      +2
                    </button>
                  </div>
                </div>
              </div>

              <!-- Timer Pertandingan -->
              <div
                class="mt-4 rounded-xl border border-court-border bg-court-box p-3.5"
              >
                <div class="flex items-center justify-between gap-3">
                  <p
                    id="timer-display"
                    class="font-mono text-3xl font-bold tabular-nums text-court-lime"
                  >
                    10:00
                  </p>
                  <label
                    class="flex items-center gap-2 text-xs text-court-muted"
                  >
                    <span>Min:</span>
                    <input
                      id="timer-minutes"
                      type="number"
                      min="1"
                      max="60"
                      value="10"
                      class="w-16 rounded-lg border border-court-border bg-court-card px-2 py-1 text-center font-mono text-sm text-court-cream focus:border-court-orange focus:outline-none"
                    />
                  </label>
                </div>

                <!-- Kontrol Timer & Selesai -->
                <div class="mt-3 grid grid-cols-4 gap-2">
                  <button
                    id="btn-timer-start"
                    type="button"
                    class="rounded-lg bg-court-orange py-2 text-xs font-bold text-court-bg transition hover:opacity-90"
                  >
                    Start
                  </button>
                  <button
                    id="btn-timer-pause"
                    type="button"
                    class="rounded-lg border border-court-border bg-court-card py-2 text-xs font-medium text-court-cream transition hover:border-court-cream"
                  >
                    Pause
                  </button>
                  <button
                    id="btn-timer-reset"
                    type="button"
                    class="rounded-lg border border-court-border bg-court-card py-2 text-xs font-medium text-court-muted transition hover:text-court-cream"
                  >
                    Reset
                  </button>
                  <button
                    id="btn-match-finish"
                    type="button"
                    class="rounded-lg bg-court-lime py-2 text-xs font-bold text-court-bg transition hover:opacity-90"
                  >
                    Selesai
                  </button>
                </div>
              </div>
            </section>

            <!-- Card 3 masuk di bawah ini -->
          </div>

          <!-- Kolom kanan: Tim/Jadwal & Klasemen -->
          <div class="space-y-5 lg:col-span-7">
            <!-- Card 4 & 5 masuk di sini -->
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
